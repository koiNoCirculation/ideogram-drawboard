# Build the web export (subpath base path from the repo name) and publish it
# to the gh-pages branch, which is the GitHub Pages source
# (Settings → Pages → Deploy from a branch → gh-pages / (root)).
# The app is a project page at https://<user>.github.io/<repo-name>/.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master, github-pages]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # github.repository is "owner/repo"; the project-page subpath is the repo
    # name (last segment). There is no github.repository_name context — it
    # expands to an empty string and silently drops the base path.
    env:
      REPO_SLUG: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # experiments.baseUrl comes from this variable (app.config.js): asset
      # links in the exported HTML are prefixed with the repo subpath.
      - name: Export web build (subpath base)
        run: EXPO_BASE_URL="/${REPO_SLUG##*/}" npx expo export --platform web

      # Verify the exported HTML actually carries the subpath prefix on its
      # asset links (experiments.baseUrl from EXPO_BASE_URL above). Without it
      # the project page 404s on every /_expo/... asset and renders blank.
      - name: Verify index.html asset links carry the repo base
        run: |
          BASE="/${REPO_SLUG##*/}"
          grep -q "src=\"$BASE/_expo/" dist/index.html \
            || { echo "::error::index.html has no $BASE-prefixed script src"; exit 1; }
          grep -q 'src="/_expo/' dist/index.html \
            && { echo "::error::index.html has unprefixed (root-relative) asset refs"; exit 1; }
          echo "OK: asset links are under $BASE"

      # spa-github-pages redirect bootstrap (deep links → 404.html → this
      # script rewrites the path back before the app bundle loads).
      - run: node scripts/inject_github_pages_bootstrap.cjs dist

      - name: Publish dist/ to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          clean: true
